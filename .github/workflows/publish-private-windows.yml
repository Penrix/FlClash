name: publish-private-windows

on:
  workflow_run:
    workflows:
      - private-windows-ci
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'penrix-private-network')
    runs-on: ubuntu-latest
    steps:
      - name: Find latest successful Windows build
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            let run = context.payload.workflow_run;
            if (!run) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'private-windows-ci.yml',
                branch: 'penrix-private-network',
                status: 'success',
                per_page: 1,
              });
              run = response.data.workflow_runs[0];
            }
            if (!run) {
              core.setFailed('No successful private Windows build was found.');
              return;
            }
            core.setOutput('run-id', String(run.id));
            core.setOutput('head-sha', run.head_sha);
            core.setOutput('run-number', String(run.run_number));
            core.setOutput('run-attempt', String(run.run_attempt));

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Penrix-Windows
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Package and checksum
        shell: bash
        run: |
          cd dist
          zip -r ../Penrix-Windows.zip .
          cd ..
          sha256sum Penrix-Windows.zip > Penrix-Windows.zip.sha256

      - name: Publish private Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_RUN_NUMBER: ${{ steps.find.outputs.run-number }}
          PRIVATE_RUN_ATTEMPT: ${{ steps.find.outputs.run-attempt }}
          PRIVATE_HEAD_SHA: ${{ steps.find.outputs.head-sha }}
        shell: bash
        run: |
          tag="penrix-private-windows-r${PRIVATE_RUN_NUMBER}-a${PRIVATE_RUN_ATTEMPT}"
          title="Penrix private Windows r${PRIVATE_RUN_NUMBER}-a${PRIVATE_RUN_ATTEMPT}"
          notes="Personal FlClash build with an isolated, highest-priority ChatGPT and Codex routing selector. Built from ${PRIVATE_HEAD_SHA}."
          set +e
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            output=$(gh release upload "$tag" \
              Penrix-Windows.zip \
              Penrix-Windows.zip.sha256 \
              --repo "${{ github.repository }}" \
              --clobber 2>&1)
          else
            output=$(gh release create "$tag" \
              Penrix-Windows.zip \
              Penrix-Windows.zip.sha256 \
              --repo "${{ github.repository }}" \
              --target "$PRIVATE_HEAD_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease 2>&1)
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=${output//$'\n'/'%0A'}
            echo "::error title=Release publish failed::$message"
            exit "$status"
          fi
