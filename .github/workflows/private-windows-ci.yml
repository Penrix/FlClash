name: private-windows-ci

on:
  push:
    branches:
      - penrix-private-network
  pull_request:
    branches:
      - penrix-private-network
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'

jobs:
  windows-private:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: private-windows-amd64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare isolated Penrix Windows identity
        shell: pwsh
        run: ./tool/prepare_penrix_private_windows.ps1

      - name: Build Penrix Windows package
        run: >-
          dart setup.dart windows --env stable --penrix-private
          --private-run-number $env:GITHUB_RUN_NUMBER
          --private-run-attempt $env:GITHUB_RUN_ATTEMPT -v

      - name: Upload Penrix Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Penrix-Windows
          path: ./dist
          if-no-files-found: error
          overwrite: true

      - name: Package private release bundle
        if: github.ref == 'refs/heads/penrix-private-network'
        shell: pwsh
        run: |
          if (Test-Path Penrix-Windows.zip) {
            Remove-Item Penrix-Windows.zip -Force
          }
          Compress-Archive -Path ./dist/* -DestinationPath Penrix-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash Penrix-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Penrix-Windows.zip" | Set-Content Penrix-Windows.zip.sha256 -Encoding ascii

      - name: Publish private Windows prerelease
        if: github.ref == 'refs/heads/penrix-private-network'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "penrix-private-windows-r$env:GITHUB_RUN_NUMBER-a$env:GITHUB_RUN_ATTEMPT"
          $title = "Penrix private Windows r$env:GITHUB_RUN_NUMBER-a$env:GITHUB_RUN_ATTEMPT"
          $notes = @"
          Penrix private FlClash Windows build.

          Side-by-side identity is isolated from upstream FlClash: separate installer AppId, executable name, application data subtree, helper service, helper port, and update channel.

          Built from $env:GITHUB_SHA.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Penrix-Windows.zip Penrix-Windows.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag Penrix-Windows.zip Penrix-Windows.zip.sha256 `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
