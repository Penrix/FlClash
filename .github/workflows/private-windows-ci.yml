name: private-windows-ci

on:
  push:
    branches:
      - penrix-private-network
  workflow_dispatch:

concurrency:
  group: private-windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'

jobs:
  windows-private:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: private-windows-amd64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Penrix Windows package
        run: >-
          dart setup.dart windows --env stable --penrix-private
          --private-run-number $env:GITHUB_RUN_NUMBER
          --private-run-attempt $env:GITHUB_RUN_ATTEMPT -v

      - name: Upload Penrix Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Penrix-Windows
          path: ./dist
          if-no-files-found: error
          overwrite: true
