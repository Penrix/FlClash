name: antisleep-android-ci

on:
  push:
    branches:
      - penrix-android-antisleep
  workflow_dispatch:

concurrency:
  group: antisleep-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Prepare Gradle
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Test Android VPN watchdog
        working-directory: android
        run: ./gradlew :service:testDebugUnitTest

      - name: Prepare release environment
        run: printf '%s\n' '{"APP_ENV":"stable"}' > env.json

      - name: Build Android arm64 release
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=env.json

      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FlClash-Android-AntiSleep.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Android-AntiSleep
          path: FlClash-Android-AntiSleep.apk
          if-no-files-found: error
