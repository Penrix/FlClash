name: private-android-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: penrix-private-network

concurrency:
  group: private-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  android-private:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: flutter pub get

      - name: Check private source format
        run: |
          files=(
            lib/common/penrix_private.dart
            lib/providers/action.dart
            lib/views/private_network.dart
            test/common/penrix_private_test.dart
            test/common/penrix_private_provider_test.dart
          )
          dart format "${files[@]}"
          git diff -- "${files[@]}"
          git diff --exit-code -- "${files[@]}"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip native build hooks for tests
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run private routing tests
        run: |
          flutter test \
            test/common/penrix_private_test.dart \
            test/common/penrix_private_provider_test.dart \
            --reporter expanded

      - name: Restore native build hooks
        run: |
          git checkout -- pubspec.yaml
          flutter pub get

      - name: Prepare build environment
        run: printf '%s\n' '{"APP_ENV":"dev"}' > env.json

      - name: Build private Android debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug --target-platform android-arm64 --dart-define-from-file=env.json

      - name: Upload private APK
        uses: actions/upload-artifact@v4
        with:
          name: penrix-flclash-private-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
